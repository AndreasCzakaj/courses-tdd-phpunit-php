# GitLab CI/CD pipeline: lint -> test -> package
# Every stage must be green before the next one starts.

stages:
  - lint
  - test
  - package

variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"
  IMAGE_NAME: "tdd-phpunit-php"

# shared by the PHP jobs
.php:
  image: php:8.3-cli
  cache:
    paths:
      - .cache/composer
  before_script:
    - php --version
    # the official PHP image comes w/out git, unzip, Composer and a coverage driver
    - apt-get update && apt-get install -y --no-install-recommends git unzip
    - pecl install pcov && docker-php-ext-enable pcov
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-progress

# Linter + metrics: coding standard PSR-12, cyclomatic complexity (CCN <= 5)
# The rules are configured in phpcs.xml. Any violation breaks the build.
lint:
  extends: .php
  stage: lint
  script:
    - composer lint

# All tests, with coverage. Less than 90% coverage breaks the build
# (see bin/check-coverage.php: PHPUnit has no option for that).
test:
  extends: .php
  stage: test
  script:
    - composer test:ci
  # GitLab reads the total coverage from the job log ...
  coverage: '/^\s*Lines:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      # ... shows the test results in the merge request ...
      junit: report.xml
      # ... and the covered lines in the diff
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Build the Docker image of the "app" and check that it starts.
# Needs a runner that supports Docker-in-Docker (gitlab.com: works out of the box).
docker:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -f Dockerfile.app -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" .
    # smoke test: the container must start and print a UUID
    - docker run --rm "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    # Push the image to Docker Hub.
    # To enable: define DOCKERHUB_USER and DOCKERHUB_TOKEN (masked!) in
    # Settings > CI/CD > Variables, then remove the comments.
    # NEVER put the token into this file.
    # - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
    # - docker tag "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$DOCKERHUB_USER/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    # - docker tag "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$DOCKERHUB_USER/$IMAGE_NAME:latest"
    # - docker push "$DOCKERHUB_USER/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    # - docker push "$DOCKERHUB_USER/$IMAGE_NAME:latest"
  # only build images from the default branch and the solution branch
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "solution"
